<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Accordi">
<meta name="theme-color" content="#14161B">
<title>Accordi per Chitarra - Classe chitarra Ignazio</title>
<style>
  :root {
    --sfondo:#F2F2F7; --carta:#FFFFFF; --testo:#1C1C1E; --grigio:#8E8E93;
    --corde:#3A3A3C; --tasti:#C7C7CC; --accento:#007AFF; --suAccento:#FFFFFF;
    --riempi: rgba(118,118,128,.14); --ombra: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
    --verde:#34C759; --rosso:#FF3B30;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, Roboto, "Segoe UI", sans-serif;
    --peso: 400; --st: 1;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--sfondo); color:var(--testo); font-family:var(--font); font-weight:var(--peso);
    -webkit-font-smoothing:antialiased; letter-spacing:-.01em; }
  body { padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
         calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); -webkit-text-size-adjust:100%; }
  .wrap { max-width:1000px; margin:0 auto; }
  .testata { display:flex; align-items:center; gap:10px; padding-top:6px; }
  .titoli { flex:1; min-width:0; }
  .testata h1 { margin:0; font-size:calc(32px*var(--st)); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
  .sottotitolo { color:var(--grigio); font-size:calc(15px*var(--st)); font-weight:500; margin-top:3px; }
  .tondo { flex:0 0 auto; width:42px; height:42px; border-radius:50%; border:0; background:var(--riempi); color:var(--accento);
    font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  /* Controllo a segmenti, come su iPhone */
  .segmenti { display:flex; background:var(--riempi); border-radius:12px; padding:3px; margin:16px 0 4px; gap:2px; }
  .segmenti button { flex:1; border:0; background:transparent; color:var(--testo); font-family:inherit; font-weight:600;
    font-size:calc(14px*var(--st)); padding:9px 4px; border-radius:9px; cursor:pointer; white-space:nowrap; }
  .segmenti button.on { background:var(--carta); box-shadow:0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); }

  .etichetta { color:var(--grigio); font-size:calc(13px*var(--st)); font-weight:600; margin:18px 4px 8px; text-transform:uppercase; letter-spacing:.02em; }
  .riga { position:relative; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 4px; scroll-behavior:smooth; }
  .riga::-webkit-scrollbar { display:none; }
  button.b { flex:0 0 auto; font-family:inherit; font-size:calc(15px*var(--st)); font-weight:600; line-height:1.2;
    color:var(--testo); background:var(--carta); border:0; box-shadow:var(--ombra);
    border-radius:14px; padding:9px 15px; min-width:50px; cursor:pointer; white-space:pre-line; transition:transform .1s; }
  button.b:active { transform:scale(.96); }
  button.b.on { background:var(--accento); color:var(--suAccento); }
  button.b.naturale:not(.on) { background:linear-gradient(var(--tinta), var(--tinta)), var(--carta); box-shadow:inset 0 0 0 1.5px var(--tintaBordo), var(--ombra); }
  button.b.grande { width:100%; padding:14px; font-size:calc(17px*var(--st)); border-radius:14px; }
  button.b.pieno { background:var(--accento); color:var(--suAccento); }
  .nota-it { display:block; font-size:.78em; font-weight:500; opacity:.75; }

  .info { display:flex; align-items:baseline; gap:14px; margin:18px 4px 12px; flex-wrap:wrap; }
  .sigla { color:var(--accento); font-size:calc(44px*var(--st)); font-weight:800; letter-spacing:-.03em; line-height:1; }
  .nome { font-size:calc(17px*var(--st)); font-weight:600; }
  .note { color:var(--grigio); font-size:calc(14px*var(--st)); margin-top:2px; }
  .griglia { display:grid; gap:12px; grid-template-columns:repeat(var(--col,2), minmax(0,1fr)); }
  .scheda { background:var(--carta); border-radius:20px; padding:12px 10px 10px; display:flex; flex-direction:column; gap:4px; box-shadow:var(--ombra); }
  .scheda h3 { margin:0; text-align:center; font-size:calc(14px*var(--st)); font-weight:600; color:var(--grigio); }
  .scheda canvas { width:100%; display:block; cursor:pointer; }
  .tab { text-align:center; color:var(--grigio); font-size:calc(12px*var(--st)); font-variant-numeric:tabular-nums; }
  .scheda button.b { width:100%; margin-top:6px; background:var(--riempi); box-shadow:none; color:var(--accento); }
  .spiega { color:var(--grigio); font-size:calc(14px*var(--st)); margin:8px 4px 10px; line-height:1.4; }
  .nascosto { display:none !important; }

  .tabella { width:100%; border-collapse:separate; border-spacing:0; font-size:calc(15px*var(--st)); background:var(--carta);
    border-radius:16px; overflow:hidden; box-shadow:var(--ombra); }
  .tabella th { color:var(--grigio); font-size:calc(12px*var(--st)); text-align:left; padding:10px 12px 6px; font-weight:600; text-transform:uppercase; }
  .tabella td { padding:12px; border-top:1px solid var(--riempi); }
  .tabella td:first-child { font-weight:700; color:var(--accento); }
  .tabella tr.on td { background:var(--accento); color:var(--suAccento); }
  .tabella tr.riga-t { cursor:pointer; }

  /* Esercizi */
  .giro { display:flex; gap:8px; margin:4px 0 2px; }
  .giro .passo { flex:1; text-align:center; background:var(--carta); border-radius:14px; padding:10px 4px; box-shadow:var(--ombra);
    font-weight:700; font-size:calc(17px*var(--st)); color:var(--grigio); transition:all .2s; }
  .giro .passo small { display:block; font-weight:500; font-size:.7em; margin-top:2px; }
  .giro .passo.ora { background:var(--accento); color:var(--suAccento); transform:scale(1.04); }
  .giro .passo.fatto { color:var(--verde); }
  .punteggio { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0 4px; }
  .punteggio div { background:var(--carta); border-radius:14px; padding:10px 4px; text-align:center; box-shadow:var(--ombra); }
  .punteggio b { display:block; font-size:calc(24px*var(--st)); font-weight:800; font-variant-numeric:tabular-nums; }
  .punteggio span { color:var(--grigio); font-size:calc(12px*var(--st)); font-weight:600; }
  .stato { text-align:center; font-size:calc(18px*var(--st)); font-weight:700; margin:14px 4px 6px; min-height:1.4em; }
  .stato.ok { color:var(--verde); } .stato.no { color:var(--rosso); }
  .livello { height:6px; border-radius:3px; background:var(--riempi); overflow:hidden; margin:4px 4px 12px; }
  .livello i { display:block; height:100%; width:0; background:var(--verde); transition:width .08s; }
  .comandi { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
  .comandi button.b { width:100%; }
  .scheda.ok { box-shadow:0 0 0 3px var(--verde), var(--ombra); }
  .scheda.no { box-shadow:0 0 0 3px var(--rosso), var(--ombra); }
  .editor { background:var(--carta); border-radius:18px; padding:10px; box-shadow:var(--ombra); margin-top:10px; }
  .editor .rigaEd { display:grid; grid-template-columns:24px 1fr 1fr 40px; gap:8px; align-items:center; padding:4px 0; }
  .editor .num { color:var(--grigio); font-weight:700; text-align:center; }
  .sel { -webkit-appearance:none; appearance:none; width:100%; font-family:inherit; font-size:calc(16px*var(--st)); font-weight:600;
    color:var(--testo); background:var(--riempi); border:0; border-radius:12px; padding:10px 12px; }
  .togli { width:40px; height:40px; border-radius:50%; border:0; background:var(--riempi); color:var(--rosso); font-size:18px; font-weight:700; cursor:pointer; }
  .bonus { display:inline-block; background:var(--verde); color:#fff; border-radius:10px; padding:2px 8px; font-size:.8em; margin-left:6px; }

  /* Pannello Personalizza */
  #pannello { position:fixed; inset:0; background:var(--sfondo); z-index:10; display:none; flex-direction:column;
    padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left)); }
  #pannello.aperto { display:flex; }
  #pannello .interno { max-width:1000px; width:100%; margin:0 auto; display:flex; flex-direction:column; min-height:0; flex:1; }
  #pannello .testata h1 { font-size:calc(28px*var(--st)); }
  #anteprima { flex:0 0 auto; }
  #opzioni { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(40px + env(safe-area-inset-bottom)); }
  .pallino { flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:3px solid transparent; font-size:17px; font-weight:700; cursor:pointer; }
  .pallino.on { border-color:var(--testo); }
  input[type=range] { width:100%; accent-color:var(--accento); height:32px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="testata">
    <div class="titoli"><h1>Accordi per Chitarra</h1><div class="sottotitolo">Classe chitarra Ignazio</div></div>
    <button class="tondo" id="apriStile" aria-label="Personalizza">⚙︎</button>
  </header>

  <div class="segmenti" id="sezioni"></div>

  <div id="boxNote">
    <div class="etichetta">Nota</div>
    <div class="riga" id="rigaNote"></div>
  </div>

  <div id="boxTipi">
    <div class="etichetta">Tipo di accordo</div>
    <div class="riga" id="rigaTipi"></div>
  </div>

  <div class="info" id="boxInfo">
    <div class="sigla" id="sigla"></div>
    <div><div class="nome" id="nome"></div><div class="note" id="note"></div></div>
  </div>

  <div class="griglia" id="schemi"></div>
  <div id="vistaPower"></div>
  <div id="vistaEsercizi"></div>
</div>

<div id="pannello">
  <div class="interno">
    <div class="testata">
      <button class="tondo" id="chiudiStile" aria-label="Indietro">‹</button>
      <h1>Personalizza</h1>
    </div>
    <div id="anteprima"></div>
    <div id="opzioni"></div>
  </div>
</div>

<script>
"use strict";
// =====================================================================
//  MOTORE DEGLI ACCORDI (stesso algoritmo dell'app Android)
// =====================================================================
const ACCORDATURA = [40, 45, 50, 55, 59, 64];
const TONICHE    = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const TONICHE_IT = ["Do","Do#","Re","Mib","Mi","Fa","Fa#","Sol","Lab","La","Sib","Si"];
const DIESIS     = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const BEMOLLI    = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const DIESIS_IT  = ["Do","Do#","Re","Re#","Mi","Fa","Fa#","Sol","Sol#","La","La#","Si"];
const BEMOLLI_IT = ["Do","Reb","Re","Mib","Mi","Fa","Solb","Sol","Lab","La","Sib","Si"];

function T(sigla, nome, minore, iv, om) { return { sigla, nome, minore, iv, om: om || [] }; }
const Q = [7];
const TIPI = [
  T("",       "maggiore",                 false, [0,4,7]),
  T("m",      "minore",                   true,  [0,3,7]),
  T("7",      "settima (di dominante)",   false, [0,4,7,10], Q),
  T("maj7",   "settima maggiore",         false, [0,4,7,11], Q),
  T("m7",     "minore settima",           true,  [0,3,7,10], Q),
  T("m(maj7)","minore settima maggiore",  true,  [0,3,7,11], Q),
  T("6",      "sesta",                    false, [0,4,7,9], Q),
  T("m6",     "minore sesta",             true,  [0,3,7,9], Q),
  T("sus2",   "seconda sospesa",          false, [0,2,7]),
  T("sus4",   "quarta sospesa",           false, [0,5,7]),
  T("7sus4",  "settima quarta sospesa",   false, [0,5,7,10], Q),
  T("add9",   "maggiore nona aggiunta",   false, [0,4,7,2]),
  T("madd9",  "minore nona aggiunta",     true,  [0,3,7,2]),
  T("9",      "nona",                     false, [0,4,7,10,2], Q),
  T("m9",     "minore nona",              true,  [0,3,7,10,2], Q),
  T("maj9",   "nona maggiore",            false, [0,4,7,11,2], Q),
  T("6/9",    "sesta e nona",             false, [0,4,7,9,2], Q),
  T("7b9",    "settima nona bemolle",     false, [0,4,7,10,1], Q),
  T("7#9",    "settima nona aumentata",   false, [0,4,7,10,3], Q),
  T("11",     "undicesima",               false, [0,7,10,2,5], [7,2]),
  T("13",     "tredicesima",              false, [0,4,10,9,7,2], [7,2]),
  T("dim",    "diminuito",                true,  [0,3,6]),
  T("dim7",   "settima diminuita",        true,  [0,3,6,9]),
  T("m7b5",   "semidiminuito",            true,  [0,3,6,10]),
  T("aug",    "aumentato",                false, [0,4,8]),
  T("7#5",    "settima quinta aumentata", false, [0,4,8,10]),
  T("5",      "bicordo (power chord)",    false, [0,7]),
];

function usaBemolli(ton, tipo) {
  const n = TONICHE[ton];
  if (n.includes("b") || n === "F") return true;
  return tipo.minore && (n === "C" || n === "D" || n === "G");
}
function nomeNota(c, bem, it) {
  c = ((c % 12) + 12) % 12;
  return it ? (bem ? BEMOLLI_IT[c] : DIESIS_IT[c]) : (bem ? BEMOLLI[c] : DIESIS[c]);
}
function siglaAccordo(ton, tipo) { return TONICHE[ton] + tipo.sigla; }
function noteAccordo(ton, tipo) {
  const b = usaBemolli(ton, tipo);
  const en = tipo.iv.map(i => nomeNota(ton + i, b, false)).join(" - ");
  const it = tipo.iv.map(i => nomeNota(ton + i, b, true)).join(" - ");
  return en + "   (" + it + ")";
}
function testoTab(p) {
  return p.tasti.map(t => t < 0 ? "x" : (t > 9 ? "(" + t + ")" : String(t))).join("");
}
function noteMidi(p) {
  const r = [];
  for (let i = 0; i < 6; i++) if (p.tasti[i] >= 0) r.push(ACCORDATURA[i] + p.tasti[i]);
  return r;
}
function zona(p) { return p.tasti.includes(0) ? 0 : p.tastoMin; }

// Forme "da manuale" che si insegnano: vengono messe per prime (maggiori, minori, settime)
const DIDATTICHE = {
  0: ["x32010","x46664","xx0232","x68886","022100","133211","244322","320003","466544","x02220","x13331","x24442"],
  1: ["x35543","x46654","xx0231","x68876","022000","133111","244222","355333","466444","x02210","x13321","x24432"],
  2: ["x32310","x46464","xx0212","x68686","020100","131211","242322","320001","464544","x02020","x13131","x21202"],
};
function posizioneDidattica(ton, tipoI) {
  const tab = DIDATTICHE[tipoI] && DIDATTICHE[tipoI][ton];
  if (!tab) return null;
  const t = tab.split("").map(c => c === "x" ? -1 : +c);
  return valuta(t, ton, TIPI[tipoI], 4);
}

const cache = {}, cacheTutte = {};
function tutteLePosizioni(ton, tipoI) { posizioni(ton, tipoI); return cacheTutte[ton + "|" + tipoI] || []; }
function posizioni(ton, tipoI) {
  const k = ton + "|" + tipoI;
  if (!cache[k]) {
    let lista = calcola(ton, TIPI[tipoI]);
    cacheTutte[k] = lista.tutte;
    const d = posizioneDidattica(ton, tipoI);
    if (d) {
      const chiave = d.tasti.join(",");
      lista = [d].concat(lista.filter(p => p.tasti.join(",") !== chiave && zona(p) !== zona(d))).slice(0, 7);
    }
    cache[k] = lista;
  }
  return cache[k];
}

function calcola(ton, tipo) {
  const nell = new Array(12).fill(false);
  tipo.iv.forEach(i => nell[(ton + i) % 12] = true);
  const minCorde = tipo.iv.length <= 2 ? 2 : 4;
  const trovate = new Map();

  for (let base = 1; base <= 13; base++) {
    const opz = [];
    for (let s = 0; s < 6; s++) {
      const o = [-1];
      if (base === 1 && nell[ACCORDATURA[s] % 12]) o.push(0);
      for (let f = base; f <= base + 3; f++) if (nell[(ACCORDATURA[s] + f) % 12]) o.push(f);
      opz.push(o);
    }
    const cur = [0,0,0,0,0,0];
    (function esplora(s) {
      if (s === 6) {
        const p = valuta(cur, ton, tipo, minCorde);
        if (p) { const key = p.tasti.join(","); if (!trovate.has(key)) trovate.set(key, p); }
        return;
      }
      for (const f of opz[s]) { cur[s] = f; esplora(s + 1); }
    })(0);
  }

  const tutte = Array.from(trovate.values());
  tutte.sort((a, b) => (b.punteggio - a.punteggio) || (zona(a) - zona(b)));
  const scelte = [];
  for (const p of tutte) {
    if (scelte.length >= 7) break;
    const z = zona(p);
    const vicina = scelte.some(q => {
      const zq = zona(q);
      return (z === 0 && zq === 0) || (z !== 0 && zq !== 0 && Math.abs(z - zq) < 2);
    });
    if (!vicina) scelte.push(p);
  }
  scelte.sort((a, b) => zona(a) - zona(b));
  scelte.tutte = tutte;
  return scelte;
}

function valuta(t, ton, tipo, minCorde) {
  let primo = 0;
  while (primo < 6 && t[primo] < 0) primo++;
  if (primo >= 6) return null;
  let ultimo = 5;
  while (ultimo > primo && t[ultimo] < 0) ultimo--;
  if (ultimo < 4 && tipo.iv.length > 2) return null;
  for (let i = primo; i <= ultimo; i++) if (t[i] < 0) return null;

  const corde = ultimo - primo + 1;
  if (corde < minCorde) return null;
  if (tipo.iv.length === 2 && (corde > 3 || primo > 2)) return null;
  if ((ACCORDATURA[primo] + t[primo]) % 12 !== ton) return null;

  const pres = new Array(12).fill(false);
  for (let i = primo; i <= ultimo; i++) pres[(ACCORDATURA[i] + t[i]) % 12] = true;
  let completa = true;
  for (const iv of tipo.iv) {
    if (!pres[(ton + iv) % 12]) {
      if (tipo.om.includes(iv)) completa = false; else return null;
    }
  }

  let min = 99, max = 0, premute = 0, vuote = 0;
  for (let i = primo; i <= ultimo; i++) {
    if (t[i] > 0) { premute++; min = Math.min(min, t[i]); max = Math.max(max, t[i]); }
    else if (t[i] === 0) vuote++;
  }
  if (premute === 0) { min = 0; max = 0; }
  if (max - min > 3) return null;
  if (vuote > 0 && max > 4) return null;

  const p = { tasti: t.slice(), dita: [0,0,0,0,0,0], barre: 0, barreDa: -1, barreA: -1, tastoMin: min, tastoMax: max, punteggio: 0 };

  let contaMin = 0;
  for (let i = primo; i <= ultimo; i++) if (t[i] === min && min > 0) contaMin++;
  let barre = false, bDa = -1, bA = -1;
  if (premute > 4 || (contaMin >= 2 && premute > 3) || contaMin >= 3) {
    if (contaMin >= 2) {
      for (let i = primo; i <= ultimo; i++) if (t[i] === min) { bDa = i; break; }
      for (let i = ultimo; i >= primo; i--) if (t[i] === min) { bA = i; break; }
      let ok = true;
      for (let i = bDa; i <= bA; i++) if (t[i] < min) ok = false;
      if (ok) {
        barre = true;
        let fino = true;
        for (let i = bA; i <= ultimo; i++) if (t[i] < min) fino = false;
        if (fino) bA = ultimo;
      }
    }
  }
  let dita;
  if (barre) {
    let altre = 0;
    for (let i = primo; i <= ultimo; i++) if (t[i] > min) altre++;
    dita = 1 + altre;
  } else dita = premute;
  if (dita > 4) return null;

  assegnaDita(p, barre, primo, ultimo);
  if (barre) { p.barre = min; p.barreDa = bDa; p.barreA = bA; }

  let punti = corde * 4 - dita * 2;
  if (completa) punti += 4;
  if (barre) punti -= 1;
  punti += vuote;
  if (primo <= 1) punti += 2;
  if (min > 0) punti -= Math.floor(min / 4);
  if (vuote > 0) punti -= max * 2;
  p.punteggio = punti;
  return p;
}

function assegnaDita(p, barre, primo, ultimo) {
  const t = p.tasti, min = p.tastoMin;
  const idx = [];
  for (let i = primo; i <= ultimo; i++) if (t[i] > 0 && !(barre && t[i] === min)) idx.push(i);
  idx.sort((a, b) => (t[a] - t[b]) || (a - b));
  let dito = barre ? 2 : 1;
  let ultimoTasto = barre ? min : -1;
  let liberi = 4 - (barre ? 1 : 0) - idx.length;
  for (const i of idx) {
    if (ultimoTasto > 0 && t[i] - ultimoTasto >= 2 && liberi > 0) { dito++; liberi--; }
    p.dita[i] = Math.min(dito, 4);
    dito++;
    ultimoTasto = t[i];
  }
  if (barre) for (let i = primo; i <= ultimo; i++) if (t[i] === min) p.dita[i] = 1;
}

function luminosita(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
}
function colori() {

}
function applicaStile() {

  r.setProperty("--accento", c.accento); r.setProperty("--suAccento", c.suAccento);
  const chiaro = luminosita(c.sfondo) > 0.5;

  r.setProperty("--tinta", "rgba(" + rgb + "," + (chiaro ? 0.10 : 0.18) + ")");

}

// =====================================================================
//  DISEGNO DELLO SCHEMA (verticale o orizzontale, destrorso o mancino)
// =====================================================================
function altezzaSchema() { return (imp.orizzontale ? 160 : 200) * imp.immagini / 100; }

function disegna(canvas, p, ton, bem, esiti) {
  const w = canvas.clientWidth, h = altezzaSchema();
  if (!w) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.height = h + "px";
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const cx = canvas.getContext("2d");
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, w, h);

  const C = colori(), k = imp.immagini / 100, orizz = imp.orizzontale, manc = imp.mancino;
  const famiglia = FONT[imp.font][1], pesoN = FONT[imp.font][2];
  const font = (size, bold) => (bold ? "700 " : pesoN + " ") + size + "px " + famiglia;
  const TV = 5;
  const inizio = p.tastoMax <= 5 ? 1 : p.tastoMin;
  let ox, oy, passoC, passoT, lungo;

  if (!orizz) {
    const sopra = 26 * k, sotto = 22 * k, lato = 28 * k;
    const alt = h - sopra - sotto;
    const larg = Math.min(w - 2 * lato, alt * 1.05);
    passoC = larg / 5; passoT = alt / TV; lungo = alt;
    ox = (w - larg) / 2; oy = sopra;
  } else {
    const vicino = 26 * k, latoNomi = 34 * k, su = 24 * k, giu = 8 * k;
    const alt = h - su - giu;
    passoC = alt / 5;
    const larg = Math.min(w - vicino - latoNomi, alt * 2.2);
    passoT = larg / TV; lungo = larg;
    const tot = vicino + larg + latoNomi;
    ox = (w - tot) / 2 + (manc ? latoNomi : vicino); oy = su;
  }
  const px = (s, u) => !orizz ? ox + (manc ? 5 - s : s) * passoC : (manc ? ox + lungo - u * passoT : ox + u * passoT);
  const py = (s, u) => !orizz ? oy + u * passoT : oy + (5 - s) * passoC;
  const linea = (x1, y1, x2, y2, col, sp) => { cx.strokeStyle = col; cx.lineWidth = sp; cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke(); };
  const scrivi = (txt, x, y, col, size, bold, align) => { cx.fillStyle = col; cx.font = font(size, bold); cx.textAlign = align; cx.textBaseline = "alphabetic"; cx.fillText(txt, x, y); };

  for (let i = 0; i <= TV; i++) linea(px(0, i), py(0, i), px(5, i), py(5, i), C.tasti, 1.5 * k);
  if (inizio === 1) {
    cx.lineCap = "round";
    linea(px(0, 0), py(0, 0), px(5, 0), py(5, 0), C.testo, 5 * k);
    cx.lineCap = "butt";
  } else {
    const n = inizio + "ª";
    if (!orizz) scrivi(n, manc ? ox + 5 * passoC + 8 * k : ox - 8 * k, py(0, 0.5) + 4 * k, C.grigio, 12 * k, true, manc ? "left" : "right");
    else scrivi(n, px(0, 0.5), oy - 9 * k, C.grigio, 12 * k, true, "center");
  }
  const colEsito = s => esiti ? (esiti[s] === "ok" ? C.verde : esiti[s] === "no" ? C.rosso : null) : null;
  for (let s = 0; s < 6; s++) {
    const ce = colEsito(s);
    linea(px(s, 0), py(s, 0), px(s, TV), py(s, TV), ce || C.corde, (ce ? 3.2 : 2.2 - s * 0.25) * k);
  }

  const r = Math.min(passoC, passoT) * 0.36;
  cx.fillStyle = (p.barre > 0 && colEsito(p.barreDa)) || C.accento;
  if (p.barre > 0) {
    const u = p.barre - inizio + 0.5;
    const x1 = px(p.barreDa, u), y1 = py(p.barreDa, u), x2 = px(p.barreA, u), y2 = py(p.barreA, u);
    const X = Math.min(x1, x2) - r, Y = Math.min(y1, y2) - r, W = Math.abs(x2 - x1) + 2 * r, H = Math.abs(y2 - y1) + 2 * r;
    cx.beginPath();
    if (cx.roundRect) cx.roundRect(X, Y, W, H, r); else cx.rect(X, Y, W, H);
    cx.fill();
  }

  for (let s = 0; s < 6; s++) {
    const f = p.tasti[s];
    let mx, my;
    if (!orizz) { mx = px(s, 0); my = oy - 13 * k; }
    else { mx = manc ? ox + lungo + 13 * k : ox - 13 * k; my = py(s, 0); }
    if (f < 0) scrivi("×", mx, my + 5 * k, C.rossoX, 15 * k, true, "center");
    else if (f === 0) { cx.strokeStyle = C.testo; cx.lineWidth = 1.6 * k; cx.beginPath(); cx.arc(mx, my, 5 * k, 0, Math.PI * 2); cx.stroke(); }

    if (f > 0) {
      const u = f - inizio + 0.5, x = px(s, u), y = py(s, u);
      const nelBarre = p.barre > 0 && f === p.barre && s >= p.barreDa && s <= p.barreA;
      if (!nelBarre) { cx.fillStyle = colEsito(s) || C.accento; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill(); }
      if (p.dita[s] > 0 && (!nelBarre || s === p.barreDa)) scrivi(String(p.dita[s]), x, y + r * 0.45, C.suAccento, r * 1.3, true, "center");
    }
    if (f >= 0) {
      const classe = (ACCORDATURA[s] + f) % 12, eT = classe === ton;
      const nn = nomeNota(classe, bem, imp.italiano);
      const col = colEsito(s) || (eT ? C.accento : C.grigio);
      if (!orizz) scrivi(nn, px(s, 0), oy + lungo + 16 * k, col, 10.5 * k, eT, "center");
      else scrivi(nn, manc ? ox - 7 * k : ox + lungo + 7 * k, py(s, 0) + 4 * k, col, 10.5 * k, eT, manc ? "right" : "left");
    }
  }
}

// =====================================================================
//  SUONO: corda pizzicata (Karplus-Strong) con Web Audio
// =====================================================================
let audio = null, sorgente = null;
function suona(midi) {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const sr = 22050, n = Math.floor(sr * 2.6), mix = new Float32Array(n), rit = Math.floor(sr * 0.035);
    midi.forEach((m, k) => {
      const f = 440 * Math.pow(2, (m - 69) / 12);
      const per = Math.max(2, Math.round(sr / f));
      const buf = new Float32Array(per);
      let prec = 0;
      for (let i = 0; i < per; i++) { prec = 0.5 * prec + 0.5 * (Math.random() * 2 - 1); buf[i] = prec; }
      let pos = 0;
      for (let i = k * rit; i < n; i++) {
        const a = pos % per, b = (pos + 1) % per, v = buf[a];
        buf[a] = 0.4985 * (buf[a] + buf[b]);
        mix[i] += v; pos++;
      }
    });
    let max = 0.0001;
    for (let i = 0; i < n; i++) max = Math.max(max, Math.abs(mix[i]));
    const fade = sr / 4;
    const ab = audio.createBuffer(1, n, sr), ch = ab.getChannelData(0);
    for (let i = 0; i < n; i++) { let v = mix[i] / max * 0.85; if (i > n - fade) v *= (n - i) / fade; ch[i] = v; }
    if (sorgente) { try { sorgente.stop(); } catch (e) {} }
    sorgente = audio.createBufferSource();
    sorgente.buffer = ab; sorgente.connect(audio.destination); sorgente.start();
  } catch (e) {}
}

// ---------- Power chords ----------
const TIPO_POWER = TIPI.find(t => t.sigla === "5");
function tastoPower(ton, corda) {               // tasto della fondamentale (0..11)
  const vuota = corda === 6 ? 4 : 9;            // 6ª corda = Mi (E), 5ª corda = La (A)
  return ((ton - vuota) % 12 + 12) % 12;
}
function posPower(ton, corda, treNote) {
  const f = tastoPower(ton, corda);
  const s = corda === 6 ? 0 : 1;
  const tasti = [-1,-1,-1,-1,-1,-1], dita = [0,0,0,0,0,0];
  tasti[s] = f; tasti[s + 1] = f + 2;
  if (treNote) tasti[s + 2] = f + 2;
  if (f > 0) { dita[s] = 1; dita[s + 1] = 3; if (treNote) dita[s + 2] = 4; }
  else { dita[s + 1] = 1; if (treNote) dita[s + 2] = 2; }
  const premuti = tasti.filter(x => x > 0);
  return { tasti, dita, barre: 0, barreDa: -1, barreA: -1,
           tastoMin: Math.min(...premuti), tastoMax: Math.max(...premuti), punteggio: 0 };
}
function testoTasto(f) { return f === 0 ? "corda a vuoto" : "tasto " + f; }

function disegnaPower() {
  const v = $("vistaPower"); v.innerHTML = "";
  const ton = imp.tonica;
  [6, 5].forEach(corda => {
    const f = tastoPower(ton, corda);
    v.appendChild(el("div", "etichetta", "Fondamentale sulla " + corda + "ª corda (" + (corda === 6 ? "Mi basso" : "La") + ")"));
    v.appendChild(el("div", "spiega", TONICHE[ton] + " (" + TONICHE_IT[ton] + ") sulla " + corda + "ª corda: " + testoTasto(f) +
      ". La quinta e l'ottava stanno due tasti più su, sulle due corde sotto."));
    const g = el("div", "griglia"); g.style.setProperty("--col", imp.colonne);
    g.appendChild(scheda(posPower(ton, corda, true), 0, TIPO_POWER, true, "3 note (con l'ottava)"));

    v.appendChild(g);

  v.appendChild(el("div", "etichetta", "Tutti i power chords"));

function costruisciOpzioni() {

    b.style.border = (i === imp.tema ? "3px solid " + ACCENTI[imp.accento][1] : "1px solid " + t.tasti);
    rt.appendChild(b);
  });
  o.appendChild(rt);

  o.appendChild(el("div", "etichetta", "Colore principale: " + ACCENTI[imp.accento][0]));
  const rc = el("div", "riga");
  ACCENTI.forEach(([nome, col], i) => {
    const b = el("button", "pallino" + (i === imp.accento ? " on" : ""), i === imp.accento ? "✓" : "");
    b.style.background = col; b.style.color = luminosita(col) > 0.55 ? "#1A1A1A" : "#FFF"; b.title = nome;
    b.onclick = () => { imp.accento = i; cambia(); };
    rc.appendChild(b);
  });
  o.appendChild(rc);

  o.appendChild(el("div", "etichetta", "Carattere"));
  const rf = el("div", "riga");
  FONT.forEach(([nome, fam, peso], i) => {
    const b = bottone(nome, i === imp.font, () => { imp.font = i; cambia(); });
    b.style.fontFamily = fam; b.style.fontWeight = peso === 300 ? 300 : 700;
    rf.appendChild(b);
  });
  o.appendChild(rf);

  o.appendChild(cursore("Dimensione testo", "testo", 70, 160));
  o.appendChild(cursore("Dimensione schemi", "immagini", 60, 180));

  o.appendChild(el("div", "etichetta", "Orientamento schemi"));
  o.appendChild(scelta(["▯  Verticale", "▭  Orizzontale"], imp.orizzontale ? 1 : 0, i => {
    const nuovo = i === 1;
    if (nuovo !== imp.orizzontale) { imp.orizzontale = nuovo; imp.colonne = nuovo ? 1 : 2; }
    cambia();
  }));
  o.appendChild(el("div", "etichetta", "Schemi per riga"));
  o.appendChild(scelta(["1", "2", "3", "4"], imp.colonne - 1, i => { imp.colonne = i + 1; cambia(); }));
  o.appendChild(el("div", "etichetta", "Mano"));
  o.appendChild(scelta(["Destrorso", "Mancino"], imp.mancino ? 1 : 0, i => { imp.mancino = i === 1; cambia(); }));
  o.appendChild(el("div", "etichetta", "Nomi delle note sotto gli schemi"));
  o.appendChild(scelta(["C  D  E", "Do  Re  Mi"], imp.italiano ? 1 : 0, i => { imp.italiano = i === 1; cambia(); }));

  const reset = bottone("↺  Ripristina impostazioni originali", false, () => {
    const t = imp.tonica, ti = imp.tipo;
    imp = Object.assign({}, PREDEFINITE, { tonica: t, tipo: ti, sezione: imp.sezione, giro: imp.giro, variante: imp.variante, zona: imp.zona, mia: imp.mia, record: imp.record });
    cambia();
  });
  reset.style.width = "100%"; reset.style.marginTop = "24px";
  o.appendChild(reset);
  o.scrollTop = y;
  [[rt, imp.tema], [rc, imp.accento]].forEach(([r, i]) => { const b = r.children[i]; if (b) r.scrollLeft = b.offsetLeft - r.clientWidth / 2 + b.offsetWidth / 2; });
}

function cambia() {
  salva(); applicaStile(); costruisciOpzioni(); aggiornaAnteprima(); aggiornaPrincipale();
}

$("apriStile").onclick = () => { $("pannello").classList.add("aperto"); costruisciOpzioni(); aggiornaAnteprima(); };
$("chiudiStile").onclick = () => { $("pannello").classList.remove("aperto"); aggiornaPrincipale(); };

let timerResize;
window.addEventListener("resize", () => { clearTimeout(timerResize); timerResize = setTimeout(ridisegnaTutti, 120); });

// =====================================================================
//  ESERCIZI CON IL MICROFONO
// =====================================================================
const VARIANTI = [   // [semitoni dalla tonica, tipo (0 magg, 1 min, 2 settima)]
  [[0,0],[9,1],[5,0],[7,0]],    // Do – Lam – Fa – Sol
  [[0,0],[9,1],[2,1],[7,0]],    // Do – Lam – Rem – Sol
  [[0,0],[9,1],[2,1],[7,2]],    // Do – Lam – Rem – Sol7
  [[0,0],[5,0],[7,0],[0,0]],    // Do – Fa – Sol – Do
  [[0,0],[7,0],[9,1],[5,0]],    // Do – Sol – Lam – Fa
];
const ZONE = [[0, "Prima posizione"], [3, "Dal 3° tasto"], [5, "Dal 5° tasto"], [8, "Dall'8° tasto"]];

/** Sceglie la diteggiatura dell'accordo nella zona del manico richiesta. */
function scegliPosizione(ton, tipoI, z) {
  if (z === 0) return posizioni(ton, tipoI)[0];
  const tutte = tutteLePosizioni(ton, tipoI).filter(p => !p.tasti.includes(0));
  let migliore = null, punti = -1e9;
  for (const p of tutte) {
    const v = p.punteggio * 2 - Math.abs(p.tastoMin - z) * 6 - (p.tastoMin < z - 1 || p.tastoMin > z + 2 ? 20 : 0);
    if (v > punti) { punti = v; migliore = p; }
  }
  return migliore || posizioni(ton, tipoI)[0];
}
const SENS = [   // [volume minimo, quota per corda, quota per nota estranea]
  [0.060, 0.26, 0.30], [0.040, 0.19, 0.40], [0.025, 0.13, 0.50], [0.015, 0.09, 0.60], [0.008, 0.06, 0.72],
];
const es = { indice: 0, punti: 0, serie: 0, giri: 0, esiti: null, esito: "", stato: "", fatti: [] };

function accordiGiro() {
  if (imp.variante === "mia") {
    return imp.mia.map(([ton, tipoI]) => ({ ton, tipoI, tipo: TIPI[tipoI], pos: scegliPosizione(ton, tipoI, imp.zona) }));
  }
  return (VARIANTI[imp.variante] || VARIANTI[0]).map(([semi, tipoI]) => {
    const ton = (imp.giro + semi) % 12;
    return { ton, tipoI, tipo: TIPI[tipoI], pos: scegliPosizione(ton, tipoI, imp.zona) };
  });
}
function nomeAccordoIt(a) {
  const it = TONICHE_IT[a.ton];
  return a.tipoI === 0 ? it : a.tipoI === 1 ? it + "m" : it + TIPI[a.tipoI].sigla;
}
function ricominciaGiro() {
  Object.assign(es, { indice: 0, punti: 0, serie: 0, giri: 0, esiti: null, esito: "", stato: "", fatti: [] });
}

function disegnaEsercizi() {
  const v = $("vistaEsercizi"); v.innerHTML = "";
  v.appendChild(el("div", "spiega", "Scegli il giro e premi «Inizia». Suona l'accordo evidenziato: se è giusto diventa verde e passi al successivo. Se sbagli, le corde da sistemare diventano rosse."));

  const mia = imp.variante === "mia";
  const boxGiro = el("div"); if (mia) boxGiro.className = "nascosto";
  boxGiro.appendChild(el("div", "etichetta", "Giro di"));
  const rg = el("div", "riga");
  TONICHE_IT.forEach((n, i) => rg.appendChild(bottoneNota(n, TONICHE[i], i === imp.giro, () => { imp.giro = i; salva(); ricominciaGiro(); disegnaEsercizi(); })));
  boxGiro.appendChild(rg);
  v.appendChild(boxGiro);
  setTimeout(() => { const b = rg.children[imp.giro]; if (b) rg.scrollLeft = b.offsetLeft - rg.clientWidth / 2 + b.offsetWidth / 2; }, 0);

  v.appendChild(el("div", "etichetta", "Accordi del giro"));
  const rv = el("div", "riga");
  VARIANTI.forEach((va, i) => {
    const nomi = va.map(([semi, tipoI]) => nomeAccordoIt({ ton: (imp.giro + semi) % 12, tipoI })).join(" – ");
    rv.appendChild(bottone(nomi, i === imp.variante, () => { imp.variante = i; salva(); ricominciaGiro(); disegnaEsercizi(); }));
  });
  rv.appendChild(bottone("✏️ La mia sequenza", mia, () => { imp.variante = "mia"; salva(); ricominciaGiro(); disegnaEsercizi(); }));
  v.appendChild(rv);
  if (mia) v.appendChild(editorSequenza());
  setTimeout(() => { const b = rv.children[mia ? VARIANTI.length : imp.variante]; if (b) rv.scrollLeft = b.offsetLeft - rv.clientWidth / 2 + b.offsetWidth / 2; }, 0);

  v.appendChild(el("div", "etichetta", "Dove suonarlo sul manico"));
  const sz = el("div", "segmenti");
  sz.style.marginTop = "0";
  ZONE.forEach(([z, nome]) => {
    const b = el("button", z === imp.zona ? "on" : "", nome.replace("Prima posizione", "Prima pos.").replace("Dal ", "").replace("Dall'", ""));
    b.onclick = () => { imp.zona = z; salva(); ricominciaGiro(); disegnaEsercizi(); };
    sz.appendChild(b);
  });
  v.appendChild(sz);

  const acc = accordiGiro();
  const giro = el("div", "giro");
  acc.forEach((a, i) => {
    const p = el("div", "passo" + (i === es.indice ? " ora" : "") + (es.fatti[i] ? " fatto" : ""));
    p.appendChild(document.createTextNode(siglaAccordo(a.ton, a.tipo)));
    p.appendChild(el("small", null, nomeAccordoIt(a)));
    giro.appendChild(p);
  });
  v.appendChild(el("div", "etichetta", (mia ? "La mia sequenza" : "Giro di " + TONICHE_IT[imp.giro]) + " · " + ZONE.find(x => x[0] === imp.zona)[1]));
  v.appendChild(giro);

  const pt = el("div", "punteggio");
  [["Punti", es.punti], ["Serie", es.serie], ["Giri", es.giri], ["Record", imp.record]].forEach(([n, x]) => {
    const d = el("div"); d.appendChild(el("b", null, String(x))); d.appendChild(el("span", null, n)); pt.appendChild(d);
  });
  v.appendChild(pt);

  const st = el("div", "stato" + (es.esito ? " " + es.esito : ""));
  st.id = "statoEs";
  st.innerHTML = es.stato || (micAttivo ? "Suona " + siglaAccordo(acc[es.indice].ton, acc[es.indice].tipo) + "…" : "Premi «Inizia» quando sei pronto");
  v.appendChild(st);
  const lv = el("div", "livello"); const barra = el("i"); barra.id = "livelloEs"; lv.appendChild(barra); v.appendChild(lv);

  const a = acc[es.indice];
  const g = el("div", "griglia"); g.style.setProperty("--col", 1);
  const doveA = (a.pos.tasti.includes(0) || a.pos.tastoMin <= 1) ? "prima posizione" : "dal " + a.pos.tastoMin + "° tasto";
  const sc = scheda(a.pos, 0, a.tipo, false, siglaAccordo(a.ton, a.tipo) + " · " + nomeAccordoIt(a) + " · " + doveA, a.ton, es.esiti);
  if (es.esito) sc.classList.add(es.esito);
  g.appendChild(sc);
  v.appendChild(g);

  const cm = el("div", "comandi");
  const bm = bottone(micAttivo ? "■ Ferma" : "🎤 Inizia", false, () => micAttivo ? (fermaMic(), disegnaEsercizi()) : avviaMic());
  bm.classList.add("pieno");
  cm.appendChild(bm);
  cm.appendChild(bottone("▶ Ascolta", false, () => { pausaFino = performance.now() + 3000; suona(noteMidi(a.pos)); }));
  cm.appendChild(bottone("Salta ›", false, () => { es.serie = 0; prossimo(false); }));
  v.appendChild(cm);
  const rc = bottone("↺ Ricomincia da capo", false, () => { ricominciaGiro(); disegnaEsercizi(); });
  rc.classList.add("grande"); rc.style.marginTop = "8px";
  v.appendChild(rc);

  v.appendChild(el("div", "etichetta", "Sensibilità del microfono: " + imp.sensibilita + " su 5"));
  const inp = el("input"); inp.type = "range"; inp.min = 1; inp.max = 5; inp.step = 1; inp.value = imp.sensibilita;
  inp.onchange = () => { imp.sensibilita = +inp.value; salva(); disegnaEsercizi(); };
  v.appendChild(inp);
  v.appendChild(el("div", "spiega", "Se gli accordi giusti non vengono riconosciuti, alza la sensibilità. Se riconosce accordi sbagliati, abbassala. Funziona meglio in una stanza silenziosa, con il telefono vicino alla chitarra."));
  ridisegnaTutti();
}

function editorSequenza() {
  const box = el("div", "editor");
  box.appendChild(el("div", "spiega", "Scegli da 1 a 4 accordi: la nota e il tipo. Poi premi «Inizia»."));
  imp.mia.forEach(([ton, tipoI], k) => {
    const r = el("div", "rigaEd");
    r.appendChild(el("div", "num", (k + 1) + "."));
    const sn = el("select", "sel");
    TONICHE_IT.forEach((n, i) => { const o = el("option", null, n + "  (" + TONICHE[i] + ")"); o.value = i; if (i === ton) o.selected = true; sn.appendChild(o); });
    const st = el("select", "sel");
    TIPI.forEach((t, i) => { const o = el("option", null, t.sigla ? t.sigla + " · " + t.nome : "Maggiore"); o.value = i; if (i === tipoI) o.selected = true; st.appendChild(o); });
    const cambiaRiga = () => { imp.mia[k] = [+sn.value, +st.value]; salva(); ricominciaGiro(); disegnaEsercizi(); };
    sn.onchange = cambiaRiga; st.onchange = cambiaRiga;
    r.appendChild(sn); r.appendChild(st);
    const x = el("button", "togli", "✕"); x.setAttribute("aria-label", "Togli");
    x.disabled = imp.mia.length <= 1; if (x.disabled) x.style.opacity = .3;
    x.onclick = () => { imp.mia.splice(k, 1); salva(); ricominciaGiro(); disegnaEsercizi(); };
    r.appendChild(x);
    box.appendChild(r);
  });
  if (imp.mia.length < 4) {
    const add = bottone("+ Aggiungi accordo", false, () => { const u = imp.mia[imp.mia.length - 1]; imp.mia.push([(u[0] + 5) % 12, 0]); salva(); ricominciaGiro(); disegnaEsercizi(); });
    add.classList.add("grande"); add.style.marginTop = "6px"; add.style.boxShadow = "none"; add.style.background = "var(--riempi)"; add.style.color = "var(--accento)";
    box.appendChild(add);
  }
  return box;
}

function prossimo(giusto) {
  if (giusto) es.fatti[es.indice] = true;
  es.indice++;
  if (es.indice >= accordiGiro().length) { es.indice = 0; if (giusto) es.giri++; es.fatti = []; }
  es.esiti = null; es.esito = ""; es.stato = "";
  disegnaEsercizi();
}

// ---------- Microfono e analisi ----------
let micAttivo = false, micCtx = null, micStream = null, analyser = null, tBuf, fBuf, somma, nSomma = 0;
let fase = "attesa", tInizio = 0, sottoDa = 0, storicoRms = [], pausaFino = 0, rafMic = 0;

async function avviaMic() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no");
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (micCtx.state === "suspended") await micCtx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const src = micCtx.createMediaStreamSource(micStream);
    analyser = micCtx.createAnalyser();
    analyser.fftSize = 16384;
    analyser.smoothingTimeConstant = 0;
    src.connect(analyser);
    tBuf = new Float32Array(analyser.fftSize);
    fBuf = new Float32Array(analyser.frequencyBinCount);
    somma = new Float32Array(analyser.frequencyBinCount);
    micAttivo = true; fase = "attesa"; sottoDa = performance.now(); storicoRms = [];
    es.stato = ""; es.esito = "";
    disegnaEsercizi();
    rafMic = requestAnimationFrame(cicloMic);
  } catch (e) {
    fermaMic();
    es.esito = "no";
    es.stato = "Microfono non disponibile. Apri l'app dal suo link (https://…github.io) e consenti l'uso del microfono.";
    disegnaEsercizi();
  }
}
function fermaMic() {
  micAttivo = false;
  cancelAnimationFrame(rafMic);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micCtx) { try { micCtx.close(); } catch (e) {} }
  micStream = null; micCtx = null; analyser = null;
}

function cicloMic() {
  if (!micAttivo || !analyser) return;
  rafMic = requestAnimationFrame(cicloMic);
  const ora = performance.now();
  analyser.getFloatTimeDomainData(tBuf);
  let q = 0;
  for (let i = tBuf.length - 2048; i < tBuf.length; i++) q += tBuf[i] * tBuf[i];
  const rms = Math.sqrt(q / 2048);
  const lv = $("livelloEs"); if (lv) lv.style.width = Math.min(100, rms * 600) + "%";

  const [minVol] = SENS[imp.sensibilita - 1];
  storicoRms.push(rms); if (storicoRms.length > 8) storicoRms.shift();
  if (rms < minVol * 0.6) { if (!sottoDa) sottoDa = ora; } else if (rms > minVol) { /* suono presente */ }

  if (ora < pausaFino) { fase = "attesa"; return; }

  if (fase === "attesa") {
    const prima = storicoRms[0] || 0;
    const silenzioPrima = sottoDa && ora - sottoDa > 120;
    if (rms > minVol && (silenzioPrima || rms > prima * 1.8)) {
      fase = "raccolta"; tInizio = ora; somma.fill(0); nSomma = 0; sottoDa = 0;
      const st = $("statoEs"); if (st) { st.className = "stato"; st.textContent = "Ascolto…"; }
    } else if (rms >= minVol * 0.6) sottoDa = 0;
  } else if (fase === "raccolta") {
    const dt = ora - tInizio;
    if (dt > 130) {
      analyser.getFloatFrequencyData(fBuf);
      for (let i = 0; i < fBuf.length; i++) somma[i] += Math.pow(10, fBuf[i] / 20);
      nSomma++;
    }
    if (dt > 650 && nSomma > 0) {
      fase = "attesa";
      valutaAccordo();
    }
  }
}

function frequenza(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function valutaAccordo() {
  const acc = accordiGiro()[es.indice];
  const sr = micCtx.sampleRate, binHz = sr / analyser.fftSize;
  const spet = somma.map(x => x / nSomma);
  const [, quotaCorda, quotaEstranea] = SENS[imp.sensibilita - 1];
  const bin = f => Math.round(f / binHz);
  const picco = (f, tol) => { let m = 0; for (let i = bin(f * (1 - tol)); i <= bin(f * (1 + tol)); i++) if (spet[i] > m) m = spet[i]; return m; };

  let rif = 0;
  for (let i = bin(70); i <= bin(1400); i++) if (spet[i] > rif) rif = spet[i];
  if (rif <= 0) return;

  // 1) Ogni corda: si sente la sua nota? (le armoniche contano solo se nessun'altra corda le produce)
  const esiti = [null, null, null, null, null, null];
  const fondamentali = [];
  for (let s = 0; s < 6; s++) if (acc.pos.tasti[s] >= 0) fondamentali.push(frequenza(ACCORDATURA[s] + acc.pos.tasti[s]));
  const daAltri = (h, f) => fondamentali.some(fa => Math.abs(fa / f - 1) > 0.02 &&
    [1, 2, 3, 4, 5, 6].some(k => Math.abs(h / (fa * k) - 1) < 0.02));
  for (let s = 0; s < 6; s++) {
    const t = acc.pos.tasti[s];
    if (t < 0) continue;
    const f = frequenza(ACCORDATURA[s] + t);
    let e = picco(f, 0.025);
    if (!daAltri(2 * f, f)) e = Math.max(e, picco(2 * f, 0.02) * 0.9);
    if (!daAltri(3 * f, f)) e = Math.max(e, picco(3 * f, 0.02) * 0.7);
    esiti[s] = e >= rif * quotaCorda ? "ok" : "no";
  }

  // 2) Note forti che non fanno parte dell'accordo (né armoniche delle note giuste)
  const classi = new Set(acc.tipo.iv.map(i => (acc.ton + i) % 12));
  const estranee = new Set();
  for (let i = bin(75); i <= bin(1100); i++) {
    if (spet[i] < rif * quotaEstranea || spet[i] < spet[i - 1] || spet[i] < spet[i + 1]) continue;
    const f = i * binHz;
    const spiegata = fondamentali.some(fa => { for (let k = 1; k <= 6; k++) if (Math.abs(f / (fa * k) - 1) < 0.03) return true; return false; });
    if (spiegata) continue;
    const pc = ((Math.round(12 * Math.log2(f / 440)) + 69) % 12 + 12) % 12;
    if (!classi.has(pc)) estranee.add(pc);
  }

  // Una nota estranea vicina (1-2 semitoni) alla nota di una corda indica che quella corda è sbagliata
  estranee.forEach(pc => {
    let migliore = -1, dist = 3;
    for (let s = 0; s < 6; s++) {
      if (acc.pos.tasti[s] < 0) continue;
      const pcs = (ACCORDATURA[s] + acc.pos.tasti[s]) % 12;
      const d = Math.min((pc - pcs + 12) % 12, (pcs - pc + 12) % 12);
      if (d < dist) { dist = d; migliore = s; }
    }
    if (migliore >= 0) esiti[migliore] = "no";
  });
  const tutteOk = esiti.every(x => x !== "no");

  const bem = usaBemolli(acc.ton, acc.tipo);
  if (tutteOk && estranee.size === 0) {
    es.serie++;
    const bonus = Math.min(es.serie - 1, 5);
    es.punti += 1 + bonus;
    if (es.punti > imp.record) { imp.record = es.punti; salva(); }
    es.esiti = esiti.map(x => x ? "ok" : null);
    es.esito = "ok";
    es.stato = "Giusto! +1" + (bonus > 0 ? '<span class="bonus">serie ×' + es.serie + " +" + bonus + "</span>" : "");
    pausaFino = performance.now() + 1300;
    disegnaEsercizi();
    setTimeout(() => { if (micAttivo && imp.sezione === "esercizi") prossimo(true); }, 1200);
  } else {
    es.serie = 0;
    es.esiti = esiti;
    es.esito = "no";
    const mancano = esiti.map((x, s) => x === "no" ? (6 - s) + "ª" : null).filter(Boolean);
    let msg = "Riprova";
    if (mancano.length) msg += " · controlla la corda " + mancano.join(", ");
    if (estranee.size) msg += (mancano.length ? " · " : " · ") + "sento una nota in più: " + [...estranee].map(c => nomeNota(c, bem, true)).join(", ");
    es.stato = msg;
    pausaFino = performance.now() + 500;
    disegnaEsercizi();
  }
}

applicaStile();
aggiornaPrincipale();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ridisegnaTutti);
